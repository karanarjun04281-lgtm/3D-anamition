<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Soldier Animation</title>
</head>
<body style="margin:0; overflow:hidden; background: #1a1a1a;">
    <div id="controls" style="position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 8px; z-index: 100; color: white; font-family: Arial; max-width: 180px;">
        <h2 style="margin: 0 0 15px 0; color: #ffaa00; font-size: 16px;">🎬 3D Soldier</h2>
        <button onclick="playAnimation()" style="background: #0066cc; color: white; border: none; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; width: 100%; font-size: 12px;">▶ Play</button>
        <button onclick="fireShot()" style="background: #0066cc; color: white; border: none; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; width: 100%; font-size: 12px;">💥 Fire</button>
        <button onclick="resetScene()" style="background: #0066cc; color: white; border: none; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; width: 100%; font-size: 12px;">🔄 Reset</button>
        <button onclick="toggleCamera()" style="background: #0066cc; color: white; border: none; padding: 10px; margin: 5px 0; border-radius: 5px; cursor: pointer; width: 100%; font-size: 12px;">📷 Camera</button>
        <p id="status" style="margin-top: 10px; font-size: 12px; color: #90ee90;">Loading...</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, soldier;
        let animationState = { isAnimating: false, cameraMode: 0, time: 0 };

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 500, 1000);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 2, 5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, shadowMap: { enabled: true } });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.type = THREE.PCFShadowShadowMap;
            document.body.appendChild(renderer.domElement);
            
            // Sun Light
            const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.left = -200;
            sunLight.shadow.camera.right = 200;
            sunLight.shadow.camera.top = 200;
            sunLight.shadow.camera.bottom = -200;
            sunLight.shadow.camera.far = 500;
            scene.add(sunLight);
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x654321, 0.5);
            scene.add(hemiLight);
            
            // Ground
            const groundGeometry = new THREE.PlaneGeometry(500, 500);
            const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3d5c2f, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);
            
            // Target
            const targetGeometry = new THREE.BoxGeometry(2, 3, 0.2);
            const targetMaterial = new THREE.MeshStandardMaterial({ color: 0xff4444 });
            const target = new THREE.Mesh(targetGeometry, targetMaterial);
            target.position.set(0, 1.5, -50);
            target.castShadow = true;
            scene.add(target);
            
            createSoldier();
            window.addEventListener('resize', onWindowResize);
            updateStatus('Ready ✓');
            animate();
        }

        function createSoldier() {
            soldier = new THREE.Group();
            
            const tacticalMaterial = new THREE.MeshStandardMaterial({ color: 0x2d5a3d });
            const bodyGeometry = new THREE.BoxGeometry(0.4, 0.8, 0.3);
            const body = new THREE.Mesh(bodyGeometry, tacticalMaterial);
            body.position.y = 1.2;
            body.castShadow = true;
            soldier.add(body);
            
            const skinMaterial = new THREE.MeshStandardMaterial({ color: 0x8b6f47 });
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), skinMaterial);
            head.position.y = 2.2;
            head.castShadow = true;
            soldier.add(head);
            
            const helmetMaterial = new THREE.MeshStandardMaterial({ color: 0x3a3a3a });
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 32), helmetMaterial);
            helmet.position.y = 2.25;
            helmet.castShadow = true;
            soldier.add(helmet);
            
            const armGeometry = new THREE.BoxGeometry(0.18, 0.8, 0.18);
            const leftArm = new THREE.Mesh(armGeometry, tacticalMaterial);
            leftArm.position.set(-0.35, 1.4, 0);
            leftArm.castShadow = true;
            soldier.add(leftArm);
            
            const rightArm = new THREE.Mesh(armGeometry, tacticalMaterial);
            rightArm.position.set(0.35, 1.4, 0);
            rightArm.castShadow = true;
            soldier.add(rightArm);
            
            const legGeometry = new THREE.BoxGeometry(0.22, 0.9, 0.22);
            const legMaterial = new THREE.MeshStandardMaterial({ color: 0x2d2d2d });
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.15, 0.3, 0);
            leftLeg.castShadow = true;
            soldier.add(leftLeg);
            
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.15, 0.3, 0);
            rightLeg.castShadow = true;
            soldier.add(rightLeg);
            
            const bootGeometry = new THREE.BoxGeometry(0.25, 0.25, 0.35);
            const bootMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            const leftBoot = new THREE.Mesh(bootGeometry, bootMaterial);
            leftBoot.position.set(-0.15, -0.1, 0.05);
            leftBoot.castShadow = true;
            soldier.add(leftBoot);
            
            const rightBoot = new THREE.Mesh(bootGeometry, bootMaterial);
            rightBoot.position.set(0.15, -0.1, 0.05);
            rightBoot.castShadow = true;
            soldier.add(rightBoot);
            
            const vestGeometry = new THREE.BoxGeometry(0.5, 0.7, 0.25);
            const vestMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            const vest = new THREE.Mesh(vestGeometry, vestMaterial);
            vest.position.y = 1.2;
            vest.position.z = -0.1;
            vest.castShadow = true;
            soldier.add(vest);
            
            // Rifle
            const rifle = new THREE.Group();
            const metalMaterial = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.4, metalness: 0.8 });
            const woodMaterial = new THREE.MeshStandardMaterial({ color: 0x5c4a3a });
            
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.2, 16), metalMaterial);
            barrel.rotation.z = Math.PI / 2;
            barrel.position.set(0.3, 0.8, -0.2);
            barrel.castShadow = true;
            rifle.add(barrel);
            
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.15, 0.5), woodMaterial);
            stock.position.set(0.25, 0.6, 0.1);
            stock.castShadow = true;
            rifle.add(stock);
            
            const magazine = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), metalMaterial);
            magazine.position.set(0.32, 0.5, -0.1);
            magazine.castShadow = true;
            rifle.add(magazine);
            
            const scope = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.3, 16), metalMaterial);
            scope.rotation.z = Math.PI / 2;
            scope.position.set(0.28, 1.15, -0.2);
            scope.castShadow = true;
            rifle.add(scope);
            
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.25, 0.12), woodMaterial);
            grip.position.set(0.2, 0.55, -0.2);
            grip.castShadow = true;
            rifle.add(grip);
            
            rifle.position.set(0.4, 1.2, -0.3);
            rifle.rotation.z = -0.3;
            rifle.rotation.y = 0.2;
            
            soldier.add(rifle);
            soldier.rifle = rifle;
            scene.add(soldier);
        }

        function updateSoldierAnimation() {
            if (!soldier || !soldier.rifle) return;
            const time = animationState.time;
            
            if (animationState.isAnimating) {
                const aimProgress = Math.min((time - animationState.animStartTime) / 1.5, 1);
                if (aimProgress < 0.5) {
                    soldier.rifle.rotation.z = -0.3 + aimProgress * 0.5;
                    soldier.rifle.rotation.x = -0.2 * aimProgress;
                    soldier.rotation.z = 0.1 * aimProgress;
                } else {
                    soldier.rifle.rotation.z = -0.05;
                    soldier.rifle.rotation.x = -0.1;
                    soldier.rotation.z = 0.1;
                    const breathe = Math.sin(time * 2) * 0.02;
                    soldier.rifle.position.y += breathe;
                }
                soldier.position.x = Math.sin(time * 0.5) * 0.05;
            } else {
                soldier.rifle.rotation.z = -0.3;
                soldier.rifle.rotation.x = 0;
                soldier.position.x = 0;
                soldier.rotation.z = 0;
            }
        }

        const cameraPositions = [
            { position: { x: -8, y: 3, z: 8 }, lookAt: { x: 0, y: 1.2, z: 0 } },
            { position: { x: 6, y: 2, z: 2 }, lookAt: { x: 0, y: 1.3, z: -20 } },
            { position: { x: 2, y: 1.8, z: 0.5 }, lookAt: { x: 0.3, y: 1.3, z: -0.3 } },
            { position: { x: 1.5, y: 1.9, z: 1.5 }, lookAt: { x: 0, y: 1.2, z: -50 } },
            { position: { x: -3, y: 0.8, z: 3 }, lookAt: { x: 0, y: 1.5, z: -30 } }
        ];

        function toggleCamera() {
            animationState.cameraMode = (animationState.cameraMode + 1) % cameraPositions.length;
            updateStatus('Camera ' + (animationState.cameraMode + 1) + '/5');
        }

        function updateCameraPosition() {
            const cameraPos = cameraPositions[animationState.cameraMode];
            const targetPos = new THREE.Vector3(cameraPos.position.x, cameraPos.position.y, cameraPos.position.z);
            camera.position.lerp(targetPos, 0.08);
            camera.lookAt(cameraPos.lookAt.x, cameraPos.lookAt.y, cameraPos.lookAt.z);
        }

        function playAnimation() {
            if (!soldier) return;
            animationState.isAnimating = true;
            animationState.animStartTime = animationState.time;
            updateStatus('Playing...');
        }

        function fireShot() {
            playAnimation();
            setTimeout(() => {
                createMuzzleFlash();
                createSmoke();
            }, 1500);
        }

        function createMuzzleFlash() {
            const flashGeometry = new THREE.ConeGeometry(0.15, 0.4, 8);
            const flashMaterial = new THREE.MeshBasicMaterial({ color: 0xff6600, emissive: 0xff6600 });
            const flash = new THREE.Mesh(flashGeometry, flashMaterial);
            const rifleWorldPos = new THREE.Vector3();
            soldier.rifle.getWorldPosition(rifleWorldPos);
            flash.position.copy(rifleWorldPos);
            flash.position.x += 0.8;
            flash.rotation.x = Math.PI / 2;
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 100);
        }

        function createSmoke() {
            for (let i = 0; i < 5; i++) {
                const smokeMaterial = new THREE.MeshBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.6 });
                const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), smokeMaterial);
                const rifleWorldPos = new THREE.Vector3();
                soldier.rifle.getWorldPosition(rifleWorldPos);
                smoke.position.copy(rifleWorldPos);
                smoke.position.x += Math.random() * 0.5;
                scene.add(smoke);
                
                setTimeout(() => {
                    smoke.position.y += 0.05;
                    smoke.scale.multiplyScalar(1.1);
                    setTimeout(() => scene.remove(smoke), 100);
                }, 50);
            }
            updateStatus('Fired! 💥');
        }

        function resetScene() {
            animationState.isAnimating = false;
            soldier.position.set(0, 0, 0);
            soldier.rotation.set(0, 0, 0);
            soldier.rifle.position.set(0.4, 1.2, -0.3);
            soldier.rifle.rotation.set(0, 0.2, -0.3);
            updateStatus('Reset ✓');
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function updateStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function animate() {
            requestAnimationFrame(animate);
            animationState.time += 0.016;
            if (soldier) updateSoldierAnimation();
            updateCameraPosition();
            renderer.render(scene, camera);
        }

        window.addEventListener('load', () => initScene());
        window.addEventListener('keypress', (e) => { if (e.key === ' ') playAnimation(); });
    </script>
</body>
</html>
